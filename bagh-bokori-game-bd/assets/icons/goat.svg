<?xml version="1.0" encoding="UTF-8"?>
<!-- ছাগল - the Black Bengal goat, by far the commonest goat in Bangladesh:
     a small, dark-coated breed with pale swept-back horns.
     Flat shapes only, for the same rendering reasons as tiger.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- horns, swept back over the head -->
  <path d="M35 32 Q20 18 14 4 Q28 10 38 24 Z" fill="#C8B694"/>
  <path d="M65 32 Q80 18 86 4 Q72 10 62 24 Z" fill="#C8B694"/>
  <path d="M33 28 Q22 18 17 9" stroke="#8E7B5C" stroke-width="2" fill="none"/>
  <path d="M67 28 Q78 18 83 9" stroke="#8E7B5C" stroke-width="2" fill="none"/>

  <!-- ears, drooping to the sides -->
  <ellipse cx="17" cy="52" rx="14" ry="8" transform="rotate(-18 17 52)" fill="#4A4A50"/>
  <ellipse cx="83" cy="52" rx="14" ry="8" transform="rotate(18 83 52)" fill="#4A4A50"/>

  <!-- head -->
  <ellipse cx="50" cy="52" rx="27" ry="30" fill="#33333A"/>

  <!-- long muzzle -->
  <ellipse cx="50" cy="74" rx="16" ry="16" fill="#4E4E56"/>

  <!-- eyes, with the horizontal pupil goats actually have -->
  <ellipse cx="37" cy="48" rx="8" ry="6" fill="#FFFFFF"/>
  <ellipse cx="63" cy="48" rx="8" ry="6" fill="#FFFFFF"/>
  <rect x="32" y="46" width="10" height="4" rx="2" fill="#2E2A24"/>
  <rect x="58" y="46" width="10" height="4" rx="2" fill="#2E2A24"/>

  <!-- nose and mouth -->
  <ellipse cx="44" cy="74" rx="3" ry="2.4" fill="#1C1C20"/>
  <ellipse cx="56" cy="74" rx="3" ry="2.4" fill="#1C1C20"/>
  <path d="M50 79 L50 83" stroke="#1C1C20" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M50 83 Q44 87 40 83" stroke="#1C1C20" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M50 83 Q56 87 60 83" stroke="#1C1C20" stroke-width="2.4" fill="none" stroke-linecap="round"/>

  <!-- beard -->
  <path d="M44 88 Q50 100 56 88 Q50 92 44 88 Z" fill="#CFC6B4"/>
</svg>
