<?xml version="1.0" encoding="UTF-8"?>
<!-- বাঘ - the Royal Bengal tiger of the Sundarbans.
     Flat shapes only: no gradients and no filters, so the drawing renders
     identically through Fyne's SVG rasteriser on desktop and in WebAssembly. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- ears -->
  <circle cx="24" cy="30" r="14" fill="#E07A18"/>
  <circle cx="76" cy="30" r="14" fill="#E07A18"/>
  <circle cx="24" cy="30" r="7.5" fill="#8C3A14"/>
  <circle cx="76" cy="30" r="7.5" fill="#8C3A14"/>

  <!-- head -->
  <ellipse cx="50" cy="55" rx="36" ry="34" fill="#F29020"/>

  <!-- cheek ruffs -->
  <ellipse cx="20" cy="62" rx="9" ry="14" fill="#FBF3E4"/>
  <ellipse cx="80" cy="62" rx="9" ry="14" fill="#FBF3E4"/>

  <!-- forehead stripes: the three-bar Bengal marking -->
  <path d="M50 22 L46 40 L54 40 Z" fill="#231409"/>
  <path d="M34 26 L30 44 L37 42 Z" fill="#231409"/>
  <path d="M66 26 L70 44 L63 42 Z" fill="#231409"/>

  <!-- cheek stripes -->
  <path d="M14 48 L30 52 L14 56 Z" fill="#231409"/>
  <path d="M86 48 L70 52 L86 56 Z" fill="#231409"/>
  <path d="M15 68 L31 66 L16 76 Z" fill="#231409"/>
  <path d="M85 68 L69 66 L84 76 Z" fill="#231409"/>

  <!-- muzzle -->
  <ellipse cx="50" cy="72" rx="22" ry="15" fill="#FBF3E4"/>

  <!-- eyes -->
  <ellipse cx="36" cy="52" rx="8" ry="7" fill="#FBF3E4"/>
  <ellipse cx="64" cy="52" rx="8" ry="7" fill="#FBF3E4"/>
  <ellipse cx="36" cy="52" rx="4" ry="5.5" fill="#1A0E05"/>
  <ellipse cx="64" cy="52" rx="4" ry="5.5" fill="#1A0E05"/>

  <!-- nose and mouth -->
  <path d="M42 66 L58 66 L50 75 Z" fill="#8C3A14"/>
  <path d="M50 75 L50 81" stroke="#8C3A14" stroke-width="3" stroke-linecap="round"/>
  <path d="M50 81 Q42 87 36 80" stroke="#8C3A14" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M50 81 Q58 87 64 80" stroke="#8C3A14" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- whiskers -->
  <path d="M30 74 L10 70" stroke="#3B2310" stroke-width="2" stroke-linecap="round"/>
  <path d="M30 78 L11 80" stroke="#3B2310" stroke-width="2" stroke-linecap="round"/>
  <path d="M70 74 L90 70" stroke="#3B2310" stroke-width="2" stroke-linecap="round"/>
  <path d="M70 78 L89 80" stroke="#3B2310" stroke-width="2" stroke-linecap="round"/>
</svg>
